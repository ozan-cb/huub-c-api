[package]
name = "huub-c-api"
version = "0.1.0"
edition = "2024"
description = "C ABI wrapper around the Huub CP solver"
license = "MIT"
repository = "https://github.com/ozan-cb/huub-c-api"
keywords = ["sat", "constraint-programming", "ffi", "c-api"]
categories = ["api-bindings", "algorithms"]

[workspace]

[lib]
name = "huub_c_api"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
huub = { git = "https://github.com/huub-solver/huub" }

[build-dependencies]
cbindgen = "0.29"

[profile.release]
opt-level = 3
lto = "thin"
