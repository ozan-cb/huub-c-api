# cbindgen configuration for huub-c-api.
#
# Produces include/huub.h, a C99 header consumable from C++ via
# `extern "C"`. cbindgen autodetects `extern "C"` fns and `repr(C)`
# types in src/lib.rs.

language = "C"
header = "/* Generated by cbindgen — do not edit by hand. */"
include_guard = "HUUB_C_API_H"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
no_includes = false
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]

[export]
prefix = ""

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
